name: Build Windows Executable

on:
  push:
    branches:
      - main
  release:
    types: [published, created]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Build Executable
      run: |
        pyinstaller --noconfirm --onefile --windowed --collect-all customtkinter --name serialport_gui src/gui.py

    - name: Upload Artifact to Workflow
      uses: actions/upload-artifact@v4
      with:
        name: serialport_gui.exe
        path: dist/serialport_gui.exe

    - name: Upload Executable to GitHub Release
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v2
      with:
        files: dist/serialport_gui.exe
