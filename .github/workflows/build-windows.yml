name: Build Windows Executable

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyserial pyinstaller customtkinter

    - name: Build Executable
      run: |
        pyinstaller --noconfirm --onefile --windowed --name serialport_gui src/gui.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: serialport_gui.exe
        path: dist/serialport_gui.exe
